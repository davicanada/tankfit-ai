name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application, rules, and catalog
        run: npm run check
      - name: Install browser for public-boundary tests
        run: npx playwright install --with-deps chromium
      - name: Test public desktop and mobile boundaries without credentials
        run: npm run test:e2e
